services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flags
      POSTGRES_DB: flags
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flags -d flags"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://flags:${POSTGRES_PASSWORD}@db:5432/flags
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://flags:${POSTGRES_PASSWORD}@db:5432/flags
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-1024}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-5}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
