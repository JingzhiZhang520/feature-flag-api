# Set a random API_KEY as an encrypted runtime variable before deploying.
name: feature-flag-api
region: sfo
services:
  - name: api
    git:
      repo_clone_url: https://github.com/JingzhiZhang520/feature-flag-api.git
      branch: main
    dockerfile_path: Dockerfile
    source_dir: /
    run_command: sh deploy/start.sh
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health/ready
      initial_delay_seconds: 15
    envs:
      - key: API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: REQUIRE_API_KEY
        scope: RUN_TIME
        value: "true"
      - key: CACHE_MAX_ENTRIES
        scope: RUN_TIME
        value: "1024"
      - key: CACHE_TTL_SECONDS
        scope: RUN_TIME
        value: "5"
databases:
  - name: db
    engine: PG
    production: false
    version: "16"
ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: api
